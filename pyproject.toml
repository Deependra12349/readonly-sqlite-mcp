[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "readonly-sqlite-mcp"
version = "0.1.0"
description = "Safe, zero-dependency MCP server for SQLite: explore and query local databases read-only by default."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Deependra" }]
keywords = ["mcp", "model-context-protocol", "sqlite", "database", "claude", "read-only"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]

[project.scripts]
readonly-sqlite-mcp = "readonly_sqlite_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Deependra12349/readonly-sqlite-mcp"

[tool.setuptools]
packages = ["readonly_sqlite_mcp"]
